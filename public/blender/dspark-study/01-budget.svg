<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DSpark allocates a shared verification budget</title>
  <desc id="desc">Two example sequences have cumulative draft-prefix confidence scores. With a total budget of five query tokens, two base tokens are reserved and the three highest scoring draft positions are selected: A1, B1, and A2. This gives query lengths A equals three and B equals two; the target model then verifies them.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8ca2ad" stroke-width="2"/></marker>
    <style>
      .title{font:700 35px system-ui,-apple-system,sans-serif;fill:#173448}.sub{font:22px system-ui,-apple-system,sans-serif;fill:#536d79}.stage{font:700 17px system-ui,-apple-system,sans-serif;letter-spacing:2px;fill:#537680}.label{font:700 25px system-ui,-apple-system,sans-serif;fill:#183b4a}.small{font:19px system-ui,-apple-system,sans-serif;fill:#5d747d}.token{font:700 20px system-ui,-apple-system,sans-serif;fill:#244853}.number{font:700 27px ui-monospace,monospace;fill:#1c4546}.formula{font:16px ui-monospace,monospace;fill:#73868b}.pill{font:700 19px system-ui,-apple-system,sans-serif;fill:#205a50}.white{font:700 19px system-ui,-apple-system,sans-serif;fill:#fff}.fine{font:17px system-ui,-apple-system,sans-serif;fill:#536d79}
    </style>
  </defs>
  <rect x="1" y="1" width="1598" height="998" rx="22" fill="#fbfcfa" stroke="#dce7e3" stroke-width="2"/>
  <text class="title" font-family="Arial, sans-serif" font-size="35" font-weight="bold" x="60" y="73">DSpark: spend the verification budget where it matters</text>
  <text class="sub" font-family="Arial, sans-serif" font-size="22" font-weight="normal" x="60" y="113">Two continuing requests share five query tokens. This example shows three draft positions per request.</text>
  <line x1="60" y1="144" x2="1540" y2="144" stroke="#e1e9e6" stroke-width="2"/>

  <text class="stage" font-family="Arial, sans-serif" font-size="17" font-weight="bold" x="60" y="192">01 / SCORE EACH PREFIX</text>
  <text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="60" y="224">A later draft only matters if its earlier drafts survive. Multiply the predicted probabilities along each row.</text>
  <text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="475" y="278">BASE QUERY</text><text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="663" y="278">DRAFT POSITIONS →</text>
  <text class="label" font-family="Arial, sans-serif" font-size="25" font-weight="bold" x="68" y="331">Request A</text>
  <text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="68" y="358">confidence: .90 × .80 × .70</text>
  <rect x="460" y="290" width="150" height="88" rx="12" fill="#e8eeec" stroke="#c7d5d0" stroke-width="2"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="535" y="342" text-anchor="middle">BASE</text>
  <g><rect x="636" y="290" width="187" height="88" rx="12" fill="#e4f4ee" stroke="#399b86" stroke-width="3"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="666" y="328">A1</text><text class="number" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="793" y="328" text-anchor="end">.90</text><text class="formula" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="666" y="355">.90</text></g>
  <g><rect x="848" y="290" width="187" height="88" rx="12" fill="#e4f4ee" stroke="#399b86" stroke-width="3"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="878" y="328">A2</text><text class="number" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="1005" y="328" text-anchor="end">.72</text><text class="formula" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="878" y="355">.90 × .80</text></g>
  <g><rect x="1060" y="290" width="187" height="88" rx="12" fill="#f0f3f2" stroke="#d4dfdb" stroke-width="2"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="1090" y="328">A3</text><text class="number" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="1217" y="328" text-anchor="end">.504</text><text class="formula" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="1090" y="355">.90 × .80 × .70</text></g>
  <text class="label" font-family="Arial, sans-serif" font-size="25" font-weight="bold" x="68" y="459">Request B</text>
  <text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="68" y="486">confidence: .80 × .40 × .90</text>
  <rect x="460" y="418" width="150" height="88" rx="12" fill="#e8eeec" stroke="#c7d5d0" stroke-width="2"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="535" y="470" text-anchor="middle">BASE</text>
  <g><rect x="636" y="418" width="187" height="88" rx="12" fill="#e4f4ee" stroke="#399b86" stroke-width="3"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="666" y="456">B1</text><text class="number" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="793" y="456" text-anchor="end">.80</text><text class="formula" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="666" y="483">.80</text></g>
  <g><rect x="848" y="418" width="187" height="88" rx="12" fill="#f0f3f2" stroke="#d4dfdb" stroke-width="2"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="878" y="456">B2</text><text class="number" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="1005" y="456" text-anchor="end">.32</text><text class="formula" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="878" y="483">.80 × .40</text></g>
  <g><rect x="1060" y="418" width="187" height="88" rx="12" fill="#f0f3f2" stroke="#d4dfdb" stroke-width="2"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="1090" y="456">B3</text><text class="number" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="1217" y="456" text-anchor="end">.288</text><text class="formula" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="1090" y="483">.80 × .40 × .90</text></g>
  <rect x="1280" y="317" width="244" height="160" rx="12" fill="#f3f7f5"/><text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="1300" y="351">B3 is .90 locally,</text><text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="1300" y="380">but only .288 for</text><text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="1300" y="409">the whole prefix.</text><text class="fine" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="1300" y="449">Green = selected below</text>

  <rect x="666" y="367" width="120" height="4" rx="2" fill="#d8e3df"/><rect x="666" y="367" width="108" height="4" rx="2" fill="#267f6d"/>
  <rect x="878" y="367" width="120" height="4" rx="2" fill="#d8e3df"/><rect x="878" y="367" width="86.4" height="4" rx="2" fill="#267f6d"/>
  <rect x="1090" y="367" width="120" height="4" rx="2" fill="#d8e3df"/><rect x="1090" y="367" width="60.48" height="4" rx="2" fill="#9fb6ae"/>
  <rect x="666" y="495" width="120" height="4" rx="2" fill="#d8e3df"/><rect x="666" y="495" width="96" height="4" rx="2" fill="#267f6d"/>
  <rect x="878" y="495" width="120" height="4" rx="2" fill="#d8e3df"/><rect x="878" y="495" width="38.4" height="4" rx="2" fill="#9fb6ae"/>
  <rect x="1090" y="495" width="120" height="4" rx="2" fill="#d8e3df"/><rect x="1090" y="495" width="34.56" height="4" rx="2" fill="#9fb6ae"/>
  <line x1="60" y1="550" x2="1540" y2="550" stroke="#e1e9e6" stroke-width="2"/>
  <text class="stage" font-family="Arial, sans-serif" font-size="17" font-weight="bold" x="60" y="599">02 / RESERVE TWO BASES, THEN SELECT THE THREE HIGHEST SCORES</text>
  <text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="60" y="634">One shared budget across the batch, not three extra positions for each request.</text>
  <g transform="translate(60 659)"><rect width="210" height="79" rx="11" fill="#e8eeec" stroke="#c7d5d0" stroke-width="2"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="105" y="48" text-anchor="middle">A BASE</text></g>
  <g transform="translate(282 659)"><rect width="210" height="79" rx="11" fill="#e8eeec" stroke="#c7d5d0" stroke-width="2"/><text class="token" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="105" y="48" text-anchor="middle">B BASE</text></g>
  <g transform="translate(504 659)"><rect width="210" height="79" rx="11" fill="#267f6d"/><text class="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="105" y="48" text-anchor="middle">A1 · .90</text></g>
  <g transform="translate(726 659)"><rect width="210" height="79" rx="11" fill="#267f6d"/><text class="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="105" y="48" text-anchor="middle">B1 · .80</text></g>
  <g transform="translate(948 659)"><rect width="210" height="79" rx="11" fill="#267f6d"/><text class="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="105" y="48" text-anchor="middle">A2 · .72</text></g>
  <text class="fine" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="1220" y="693">5 QUERY TOKENS</text><text class="fine" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="1220" y="722">2 base + 3 drafts</text>

  <line x1="60" y1="776" x2="1540" y2="776" stroke="#e1e9e6" stroke-width="2"/>
  <text class="stage" font-family="Arial, sans-serif" font-size="17" font-weight="bold" x="60" y="826">03 / VERIFY THE SELECTED PREFIXES</text>
  <text class="label" font-family="Arial, sans-serif" font-size="25" font-weight="bold" x="60" y="876">A → 3 query tokens</text><text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="60" y="906">base + A1 + A2</text>
  <text class="label" font-family="Arial, sans-serif" font-size="25" font-weight="bold" x="460" y="876">B → 2 query tokens</text><text class="small" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="460" y="906">base + B1</text>
  <path d="M800 873 H905" stroke="#8ca2ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="930" y="833" width="330" height="88" rx="13" fill="#e8eff5" stroke="#9cb5c8" stroke-width="2"/><text class="label" font-family="Arial, sans-serif" font-size="25" font-weight="bold" x="1095" y="886" text-anchor="middle">TARGET MODEL</text>
  <text class="fine" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="1290" y="866">Selection allocates verification.</text><text class="fine" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="1290" y="894">Verification decides acceptance.</text>
  <text class="fine" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="60" y="965">Illustrative scores · DeepInfer reference: schedule_mtp_varlen.py, lines 54–98</text>
</svg>
